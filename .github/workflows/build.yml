name: Compilar Dark Souls Java J2ME

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Descargar Toolkit J2ME de forma estable
        run: |
          mkdir -p wtk/wtklib
          
          # Descarga directa apuntando a la rama main y master de repositorios estables
          curl -sL https://raw.githubusercontent.com/notnoop/wtk-2.5.2/main/wtklib/kenv.zip -o wtk/wtklib/kenv.zip || \
          curl -sL https://raw.githubusercontent.com/notnoop/wtk-2.5.2/master/wtklib/kenv.zip -o wtk/wtklib/kenv.zip || \
          curl -sL https://raw.githubusercontent.com/shunjikonishi/wtk-2.5.2/main/wtklib/kenv.zip -o wtk/wtklib/kenv.zip
          
          # Verificar que el archivo pese más de 10 KB (evita páginas de error HTML de 404)
          FILESIZE=$(wc -c <"wtk/wtklib/kenv.zip")
          if [ "$FILESIZE" -lt 10000 ]; then
            echo "Error: El archivo descargado está corrupto o es una página de error (Tamaño: $FILESIZE bytes)."
            exit 1
          else
            echo "¡kenv.zip descargado correctamente ($FILESIZE bytes)!"
          fi

      - name: Compilar y empaquetar MIDlet (.jar)
        run: |
          mkdir -p build/classes
          javac -bootclasspath wtk/wtklib/kenv.zip -d build/classes DarkSoulsGame.java
          
          cd build/classes
          jar cvfm ../DarkSouls2D.jar ../../manifest.mf *
          cd ../..

      - name: Subir artefacto compilado
        uses: actions/upload-artifact@v4
        with:
          name: dark-souls-jar
          path: build/DarkSouls2D.jar
