name: Compilar Dark Souls Java J2ME

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Descargar Toolkit J2ME de forma robusta
        run: |
          mkdir -p wtk/wtklib
          
          # Descargar un repositorio completo que contenga el WTK y las librerías necesarias
          curl -sL https://github.com/gtalent/wtk-2.5.2-linux/archive/refs/heads/master.zip -o wtk_repo.zip || \
          curl -sL https://github.com/notnoop/wtk-2.5.2/archive/refs/heads/master.zip -o wtk_repo.zip
          
          # Descomprimir el repositorio descargado
          if [ -f "wtk_repo.zip" ]; then
            unzip -q wtk_repo.zip
            find . -name "kenv.zip" -exec cp {} wtk/wtklib/ \;
          fi
          
          # Verificación estricta del tamaño del archivo kenv.zip
          if [ -f "wtk/wtklib/kenv.zip" ]; then
            FILESIZE=$(wc -c <"wtk/wtklib/kenv.zip")
            echo "Tamaño de kenv.zip: $FILESIZE bytes"
            if [ "$FILESIZE" -lt 10000 ]; then
              echo "Error: El archivo kenv.zip extraído es demasiado pequeño o inválido."
              exit 1
            fi
          else
            echo "Error crítico: No se pudo localizar kenv.zip."
            exit 1
          fi
          echo "¡Librería kenv.zip lista y verificada!"

      - name: Compilar y empaquetar MIDlet (.jar)
        run: |
          mkdir -p build/classes
          javac -bootclasspath wtk/wtklib/kenv.zip -d build/classes DarkSoulsGame.java
          
          cd build/classes
          jar cvfm ../DarkSouls2D.jar ../../manifest.mf *
          cd ../..

      - name: Subir artefacto compilado
        uses: actions/upload-artifact@v4
        with:
          name: dark-souls-jar
          path: build/DarkSouls2D.jar
